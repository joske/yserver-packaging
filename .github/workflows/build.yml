name: Build packages

# Builds the Fedora, Debian and Alpine packages inside that distro's own
# container, so each one uses the real toolchain and policy checker rather
# than an Ubuntu approximation.
#
# What this proves: the recipes build and pass policy lint.
# What it CANNOT prove: that the resulting packages run. No GitHub runner has
# a GPU, KMS or input devices, and neither rpmlint nor lintian models dlopen —
# so a missing Vulkan loader or a stale seatd dependency would sail through
# here and fail on a user's machine. Runtime dependency correctness has to be
# checked by installing on real hardware.
#
# No Arch job: the Arch package is an AUR PKGBUILD maintained in its own
# repository.
#
# Note on interpolation: every externally-supplied value (the dispatch ref)
# reaches the shell through `env:`, never through direct ${{ }} substitution
# inside `run:`. A ref is attacker-chosen text and would otherwise be a shell
# injection point.

# On demand or on release only. NOT on push: every run is three full release
# builds of the whole workspace, which is far too expensive to spend on an
# ordinary commit. Edit a recipe, then run it yourself with workflow_dispatch.
# One entry point for both humans and yserver's release workflow, which calls
# `gh workflow run build.yml -f ref=<tag>`. Not repository_dispatch: that
# would need a cross-repo token with "Contents: write" (enough to push commits
# here), where workflow_dispatch needs only "Actions: write".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: yserver git ref to build (tag, branch or commit)
        default: master
        required: false
      sha:
        description: >-
          Optional commit SHA the ref must resolve to. The release workflow
          passes the commit it bound, so a tag moved mid-run cannot silently
          produce packages from different content.
        required: false

# Puts the built ref in the run's title, so yserver's release workflow can
# correlate the run it dispatched instead of assuming "newest run wins".
run-name: packages for ${{ inputs.ref }}

# One build per ref at a time. Note this is NOT a FIFO queue: GitHub keeps a
# single pending run per group, so a newer pending dispatch replaces the
# previous pending one rather than lining up behind it.
concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Produce ONE source tarball that every distro job consumes, so all three
  # build byte-identical sources. Deliberately generated with `git archive`
  # from the upstream checkout rather than downloaded from a GitHub release:
  # that lets packaging be validated before a tag is ever published, which is
  # the difference between this workflow being useful and being a
  # chicken-and-egg problem.
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Check out packaging recipes
        uses: actions/checkout@v7
        with:
          path: packaging

      - name: Resolve the upstream ref to build
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -eu
          ref="$INPUT_REF"
          [ -n "$ref" ] || ref=master
          # Constrain to what a git ref can legitimately look like, so a
          # hostile dispatch payload cannot smuggle anything downstream.
          case "$ref" in
            *[!A-Za-z0-9._/-]*|-*|*..*)
              echo "::error::refusing suspicious ref: $ref"; exit 1 ;;
          esac
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'Building yserver ref: %s\n' "$ref"

      - name: Check out yserver
        uses: actions/checkout@v7
        with:
          repository: joske/yserver
          ref: ${{ steps.resolve.outputs.ref }}
          path: yserver
          fetch-depth: 0

      - name: Verify the checkout is the expected commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          if [ -z "${EXPECTED_SHA:-}" ]; then
            echo "::notice::no expected SHA supplied — building whatever the ref resolves to"
            exit 0
          fi
          got=$(git -C yserver rev-parse HEAD)
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::ref resolved to $got but $EXPECTED_SHA was expected"
            exit 1
          fi
          echo "checkout is $got, as expected."

      - name: Sanity-check the recipes before building anything
        # Every one of these is cheap and every one of them otherwise surfaces
        # as a failure three long container builds later.
        run: |
          set -eu
          fail=0

          # Shell syntax of the APKBUILD, and make(1) syntax of debian/rules.
          sh -n packaging/alpine/APKBUILD || fail=1

          # Required files. A missing debian/source/format or an unexecutable
          # debian/rules fails deep inside dpkg-buildpackage.
          for f in packaging/fedora/yserver.spec packaging/debian/control \
                   packaging/debian/rules packaging/debian/changelog \
                   packaging/debian/copyright packaging/debian/source/format \
                   packaging/alpine/APKBUILD; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          [ -x packaging/debian/rules ] || { echo "::error::debian/rules is not executable"; fail=1; }

          # The recipes call `just install`/`just man`; upstream must actually
          # provide them at this ref.
          for r in man install; do
            grep -qE "^$r:" yserver/Justfile \
              || { echo "::error::upstream Justfile has no '$r' recipe at this ref"; fail=1; }
          done

          # Inputs `just install` preflights. If upstream moved or renamed one,
          # every recipe here breaks identically.
          for f in yserver/LICENSE yserver/docs/setup.md yserver/starty \
                   yserver/examples/lightdm-99-yserver.conf.in \
                   yserver/examples/yserver.tmpfiles \
                   yserver/docs/man/yserver.1.scd yserver/docs/man/starty.1.scd; do
            [ -f "$f" ] || { echo "::error::upstream is missing $f"; fail=1; }
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "recipe sanity checks passed"

      - name: Cross-check recipe versions against upstream
        id: version
        run: |
          set -eu
          cargo_ver=$(grep -m1 '^version' yserver/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          spec_ver=$(sed -n 's/^Version:[[:space:]]*//p' packaging/fedora/yserver.spec | head -n1)
          deb_ver=$(sed -n '1s/.*(\([^-]*\)-.*/\1/p' packaging/debian/changelog)
          apk_ver=$(sed -n 's/^pkgver=//p' packaging/alpine/APKBUILD | head -n1)

          printf 'upstream Cargo.toml : %s\n' "$cargo_ver"
          printf 'fedora/yserver.spec : %s\n' "$spec_ver"
          printf 'debian/changelog    : %s\n' "$deb_ver"
          printf 'alpine/APKBUILD     : %s\n' "$apk_ver"

          # A mismatch is the failure this check exists for: %prep unpacks
          # yserver-%{version}, so a stale recipe version does not produce a
          # wrong package, it produces a confusing "directory not found".
          fail=0
          for v in "$spec_ver" "$deb_ver" "$apk_ver"; do
            [ "$v" = "$cargo_ver" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::recipe version(s) disagree with upstream $cargo_ver — bump the recipes"
            exit 1
          fi
          printf 'version=%s\n' "$cargo_ver" >> "$GITHUB_OUTPUT"

      - name: Check the committed source checksum
        # Informational only. The build jobs let `abuild checksum` recompute the
        # hash, so a stale committed value never breaks CI — it breaks a USER
        # running abuild from this repo. The update-checksum job below fixes it
        # after a tagged build, so a mismatch here is a notice, not a failure.
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          case "$REF" in
            v[0-9]*) ;;
            *) echo "::notice::ref $REF is not a release tag — skipping"; exit 0 ;;
          esac
          url="https://github.com/joske/yserver/archive/refs/tags/$REF.tar.gz"
          if ! curl -sSLf -o src.tar.gz "$url"; then
            echo "::warning::could not fetch $url"
            exit 0
          fi
          actual=$(sha512sum src.tar.gz | cut -d' ' -f1)
          committed=$(sed -n '/^sha512sums=/,/"$/p' packaging/alpine/APKBUILD \
                      | grep -oE '^[0-9a-f]{128}' | head -n1 || true)
          if [ "$committed" = "$actual" ]; then
            echo "alpine/APKBUILD sha512sum matches the source archive."
          else
            echo "::warning::alpine/APKBUILD sha512sum is stale for $REF"
            echo "::warning::committed: ${committed:-<none>}"
            echo "::warning::actual:    $actual"
          fi

      - name: Create the source tarball
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git -C yserver archive --format=tar.gz \
              --prefix="yserver-$V/" -o "../yserver-$V.tar.gz" HEAD
          ls -l "yserver-$V.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          if-no-files-found: error
          path: yserver-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 7

  fedora:
    needs: source
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      V: ${{ needs.source.outputs.version }}
    steps:
      # git first: actions/checkout falls back to a slower REST download
      # without it. rpmlint is not in the buildroot by default.
      - name: Install build tooling
        run: |
          dnf -y install git rpm-build rpmdevtools rpmlint \
              rust cargo gcc pkgconf-pkg-config just scdoc glslc \
              libxshmfence-devel libxkbcommon-devel libinput-devel \
              fontconfig-devel freetype-devel mesa-libgbm-devel \
              systemd-devel systemd-rpm-macros
          rustc --version

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source-tarball

      - name: Build the RPM
        run: |
          set -eu
          rpmdev-setuptree
          mv "yserver-$V.tar.gz" ~/rpmbuild/SOURCES/
          rpmbuild -ba fedora/yserver.spec

      - name: rpmlint
        # Blocking. Previously this was continue-on-error, which meant rpmlint
        # exited 64 on real findings and the job stayed green — the packages
        # shipped with a tmpfiles path missing from %files and unescaped macros
        # in spec comments. Noise is filtered by name in fedora/rpmlint.toml so
        # it cannot hide anything else.
        run: rpmlint -c fedora/rpmlint.toml ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.src.rpm

      - name: Verify package contents
        run: |
          set -eu
          main=$(ls ~/rpmbuild/RPMS/*/yserver-"$V"-*.rpm 2>/dev/null | grep -v debug | head -n1)
          [ -n "$main" ] || { echo "::error::no yserver rpm built"; exit 1; }
          echo "=== $main ==="
          listing=$(rpm -qlp "$main")
          printf '%s\n' "$listing"

          # Assert rather than display: fail the job when an expected path is
          # absent instead of printing a listing nobody reads.
          for want in usr/bin/yserver usr/bin/starty; do
            printf '%s\n' "$listing" | grep -qE "(^|/)$want\$" \
              || { echo "::error::$want missing from $main"; exit 1; }
          done
          for want in yserver starty; do
            printf '%s\n' "$listing" | grep -qE "usr/share/man/man1/$want\.1(\.gz)?\$" \
              || { echo "::error::man1/$want.1 missing from $main"; exit 1; }
          done
          printf '%s\n' "$listing" | grep -qE "tmpfiles\.d/yserver\.conf\$" \
            || { echo "::error::tmpfiles.d/yserver.conf missing from $main"; exit 1; }
          echo "package contents verified"

      - uses: actions/upload-artifact@v7
        with:
          name: fedora-rpms
          # Without this the action only WARNS when nothing matches and the
          # job still passes — which is how a run reported success while
          # uploading no packages at all.
          if-no-files-found: error
          path: |
            ~/rpmbuild/RPMS/*/*.rpm
            ~/rpmbuild/SRPMS/*.src.rpm

  debian:
    needs: source
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      V: ${{ needs.source.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tooling
        # No cargo/rustc here: trixie ships 1.85 and yserver needs 1.87
        # (u32::is_multiple_of, cast_unsigned). The toolchain comes from rustup
        # below instead. That is fine for a .deb we ship ourselves — users
        # install a compiled binary and never need a Rust toolchain — but it
        # would disqualify the package from the Debian archive proper, which
        # requires offline builds from declared build-dependencies only.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              git curl ca-certificates build-essential dpkg-dev debhelper devscripts lintian \
              just scdoc glslc pkgconf \
              libxshmfence-dev libxkbcommon-dev libinput-dev \
              libfontconfig-dev libfreetype-dev libgbm-dev libudev-dev

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source-tarball

      # JS actions run inside the job container, so this installs a current
      # toolchain into the Debian container itself. Caching is off: the action
      # keys the cache on a workspace-root Cargo.lock, and this workspace root
      # holds packaging recipes, not the crate.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          # The action defaults to RUSTFLAGS="-D warnings". That belongs in
          # upstream's own CI, not in a packaging build: it would turn any
          # future compiler warning into a failed package for a distro that
          # happens to ship a newer rustc.
          rustflags: ""

      - name: Show the toolchain actually in use
        run: |
          rustc --version
          cargo --version

      - name: Build the .deb
        run: |
          set -eu
          # debian/ lives in this repo, not in the upstream tarball, so the
          # two have to be combined before dpkg-buildpackage will work.
          tar xzf "yserver-$V.tar.gz"
          cp -r debian "yserver-$V/debian"
          # Binary-only build: a source build would additionally want the
          # tarball renamed to yserver_$V.orig.tar.gz for 3.0 (quilt).
          cd "yserver-$V"
          dpkg-buildpackage -us -uc -b

      - name: lintian
        # Blocking, for the same reason as rpmlint: as continue-on-error it
        # exited 2 on a real error (an unversioned dependency on the Essential
        # package util-linux) and the job stayed green.
        #
        # --tag-display-limit 0 replaces the deprecated --no-tag-display-limit.
        # Only initial-upload-closes-no-bugs is suppressed: it wants the
        # changelog to close an ITP bug, which applies to a package being
        # uploaded to the Debian archive, and this one is not.
        run: |
          lintian --tag-display-limit 0 \
                  --suppress-tags initial-upload-closes-no-bugs \
                  ./*.deb

      - name: Verify package contents
        # One .deb at a time: `dpkg -c` takes exactly one argument, and the
        # build produces two packages (yserver plus the automatic
        # yserver-dbgsym, since the release profile carries debug info).
        run: |
          set -eu
          for d in ./*.deb; do
            echo "=== $d ==="
            dpkg -c "$d"
          done

          # Assert rather than display, and fail the job when an expected path
          # is absent. Command substitution so a failure cannot hide behind a
          # pipeline's exit status.
          main="yserver_${V}-1_amd64.deb"
          [ -f "$main" ] || { echo "::error::$main not built"; exit 1; }
          listing=$(dpkg -c "$main")
          for want in usr/bin/yserver usr/bin/starty; do
            printf '%s\n' "$listing" | grep -qE "(^|/)$want\$" \
              || { echo "::error::$want missing from $main"; exit 1; }
          done
          for want in yserver starty; do
            printf '%s\n' "$listing" | grep -qE "usr/share/man/man1/$want\.1(\.gz)?\$" \
              || { echo "::error::man1/$want.1 missing from $main"; exit 1; }
          done
          echo "package contents verified"

      - uses: actions/upload-artifact@v7
        with:
          name: debian-debs
          if-no-files-found: error
          path: "*.deb"

  alpine:
    needs: source
    runs-on: ubuntu-latest
    container: alpine:3.24
    env:
      V: ${{ needs.source.outputs.version }}
    steps:
      - name: Install build tooling
        # `apk update` first, and deliberately NOT `--no-cache`: that flag
        # fetches the package index transiently and discards it, so when
        # `abuild -r` later installs depends+makedepends as a virtual package,
        # apk has no index and reports every dependency as "no such package".
        run: |
          apk update
          apk add git alpine-sdk \
              cargo just scdoc shaderc gcc musl-dev pkgconf \
              libxshmfence-dev libxkbcommon-dev libinput-dev \
              fontconfig-dev freetype-dev mesa-dev eudev-dev
          rustc --version

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source-tarball

      - name: Build the .apk
        run: |
          set -eu
          # abuild refuses to run as root unless forced; -F is the documented
          # escape hatch and avoids creating a build user in a throwaway
          # container. It still needs a signing key.
          #
          # PACKAGER must be set BEFORE keygen: the key is named after it, and
          # with it unset abuild-keygen produces "-<hex>.rsa.pub" — a leading
          # dash that every later command would parse as an option.
          export PACKAGER="Jos Dehaes <jos.dehaes@gmail.com>"
          # abuild shells package installs through $SUDO_APK (default
          # abuild-apk, which falls back to doas when not root). We are root,
          # so pin it to plain apk and remove the whole doas dependency class
          # from this job rather than fixing one call site at a time.
          export SUDO_APK=apk
          # Deliberately NOT `abuild-keygen -i`: that shells out to `doas` to
          # copy the pubkey into /etc/apk/keys even when already root, and
          # alpine-sdk does not depend on doas. Installing doas would not be a
          # reliable fix either — without a doas.conf it can refuse for uid 0
          # too. As root the install is just a cp.
          abuild-keygen -a -n
          mkdir -p /etc/apk/keys
          cp "$HOME"/.abuild/*.rsa.pub /etc/apk/keys/
          # Point abuild at the local tarball so it does not fetch Source over
          # the network, and so it checksums exactly what we built.
          cp "yserver-$V.tar.gz" alpine/
          cd alpine
          export SRCDEST="$PWD"
          # The committed sha512sums are empty until a release tarball is
          # published; recompute for whatever ref this run built.
          #
          # -F ("force run as root") is required on EVERY abuild invocation,
          # including checksum — each one re-runs the root check independently,
          # so `abuild checksum` without it dies with "Do not run abuild as
          # root" before the build is even reached.
          abuild -F checksum
          abuild -F -r

          # Collect the output into the workspace. REPODEST is
          # $HOME/packages/<name-of-startdir's-parent>/$arch, and HOME here is
          # /github/home rather than /root; upload-artifact does not expand
          # shell variables or ~, so copy to a known path instead of guessing.
          mkdir -p "$GITHUB_WORKSPACE/apks"
          cp "$HOME"/packages/*/*/*.apk "$GITHUB_WORKSPACE/apks/"
          ls -l "$GITHUB_WORKSPACE/apks/"

      - name: Show package contents
        # Same one-argument caution as the Debian job: tar takes a single -f,
        # and the build produces yserver plus the yserver-doc subpackage.
        run: |
          set -eu
          # No `tar ... | sort`: POSIX sh has no pipefail, so a pipeline's
          # status is the LAST command's and `sort` succeeding would mask tar
          # failing. That is exactly how a previous run reported success while
          # listing nothing at all.
          [ -e apks/yserver-"$V"-r0.apk ] || { echo "::error::no yserver apk in apks/"; exit 1; }
          for a in apks/*.apk; do
            echo "=== $a ==="
            listing=$(tar tzf "$a")
            printf '%s\n' "$listing" | sort
          done

          # Assert, do not merely display. A step that only lists is how the
          # empty-glob bug survived: it printed nothing and still passed.
          # Man pages may or may not be gzipped depending on the distro, so
          # the pattern tolerates both rather than risking a false failure.
          main=$(tar tzf apks/yserver-"$V"-r0.apk)
          for want in usr/bin/yserver usr/bin/starty; do
            printf '%s\n' "$main" | grep -qE "(^|/)$want\$" \
              || { echo "::error::$want missing from the yserver apk"; exit 1; }
          done
          doc=$(tar tzf apks/yserver-doc-"$V"-r0.apk)
          for want in yserver starty; do
            printf '%s\n' "$doc" | grep -qE "usr/share/man/man1/$want\.1(\.gz)?\$" \
              || { echo "::error::man1/$want.1 missing from the yserver-doc apk"; exit 1; }
          done

          # The licence must be in the MAIN package: abuild's default_doc sweeps
          # /usr/share/licenses into -doc, which left 1.4.0's main apk with no
          # licence at all. The doc() override copies it back, so it is expected
          # in BOTH packages — Alpine convention keeps it in -doc, and a
          # main-only install should still carry one. This asserts the override
          # worked rather than assuming abuild packages the main apk after the
          # subpackage splits.
          printf '%s\n' "$main" | grep -qE "usr/share/licenses/yserver/LICENSE\$" \
            || { echo "::error::LICENSE missing from the main yserver apk"; exit 1; }
          echo "package contents verified"

      - uses: actions/upload-artifact@v7
        with:
          name: alpine-apks
          if-no-files-found: error
          path: apks/*.apk

  # Keep alpine/APKBUILD's sha512sums correct for people building from this repo
  # with abuild. CI itself never needs it — the alpine job runs
  # `abuild -F checksum` and regenerates the hash — so this exists purely so
  # that a user who clones and runs abuild is not met by a checksum failure.
  # Doing it by hand every release is the kind of step that gets forgotten.
  #
  # Commits with THIS repository's own GITHUB_TOKEN, deliberately: the
  # alternative was granting yserver's release token Contents: write here, which
  # is far more access than "start a build" needs.
  update-checksum:
    needs: [source, fedora, debian, alpine]
    if: startsWith(needs.source.outputs.ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Refresh the sha512sums for the released tag
        env:
          REF: ${{ needs.source.outputs.ref }}
          V: ${{ needs.source.outputs.version }}
        run: |
          set -eu
          # Work from CURRENT master, not the checkout this run started with.
          # Otherwise: master gets bumped to 1.4.2 while the containers build,
          # this commits 1.4.1's hash, and the rebase succeeds cleanly because
          # pkgver and sha512sums are different lines — leaving pkgver=1.4.2
          # paired with 1.4.1's archive name and hash.
          git fetch origin master
          git reset --hard origin/master

          # If master has moved on to another version, this run's hash is stale
          # by definition and someone else's build will fill in the right one.
          if ! grep -qxF "pkgver=$V" alpine/APKBUILD; then
            echo "::notice::master is no longer at pkgver=$V — leaving the checksum alone"
            exit 0
          fi

          url="https://github.com/joske/yserver/archive/refs/tags/$REF.tar.gz"
          curl -sSLf -o src.tar.gz "$url"
          sha=$(sha512sum src.tar.gz | cut -d' ' -f1)
          rm -f src.tar.gz
          [ ${#sha} -eq 128 ] || { echo "::error::bad sha512: $sha"; exit 1; }

          # Rewrite the block with awk: no nested quoting to get wrong, and
          # anchored at ^ so a commented example cannot be hit. Single- vs
          # multi-line is decided by COUNTING quotes on the opener, so a
          # trailing comment does not fool it, and a closing quote may be
          # indented. An unterminated block is a hard error — an earlier version
          # silently discarded everything after the block and still passed both
          # `sh -n` and the checksum grep, because the truncated file was valid
          # shell.
          awk -v sha="$sha" -v ver="$V" '
            /^sha512sums="/ {
              line = $0
              q = gsub(/"/, "", line)
              print "sha512sums=\""
              print sha "  yserver-" ver ".tar.gz"
              print "\""
              if (q < 2) skip = 1
              seen++
              next
            }
            skip && /^[ \t]*"/ { skip = 0; next }
            skip { next }
            { print }
            END {
              if (seen != 1) {
                print "expected exactly 1 sha512sums block, found " seen+0 > "/dev/stderr"
                exit 1
              }
              if (skip) {
                print "unterminated sha512sums block" > "/dev/stderr"
                exit 1
              }
            }
          ' alpine/APKBUILD > APKBUILD.new && mv APKBUILD.new alpine/APKBUILD

          # Assert the end state rather than trusting the rewrite.
          grep -qxF "$sha  yserver-$V.tar.gz" alpine/APKBUILD \
            || { echo "::error::sha512sums block was not written as expected"; exit 1; }
          sh -n alpine/APKBUILD \
            || { echo "::error::rewritten APKBUILD is not valid shell"; exit 1; }
          # `sh -n` passing proves nothing about content: a truncated APKBUILD
          # is still valid shell. Assert the recipe itself is intact.
          # Only things every APKBUILD must have. NOT build(): abuild treats it
          # as optional, so requiring it would be a spurious failure the day a
          # recipe legitimately drops it.
          for marker in "^pkgname=" "^pkgver=" "^package\(\)"; do
            grep -qE "$marker" alpine/APKBUILD \
              || { echo "::error::rewrite destroyed the recipe: $marker is gone"; exit 1; }
          done

          if git diff --quiet alpine/APKBUILD; then
            echo "sha512sums already correct for $REF — nothing to commit."
            exit 0
          fi
          git --no-pager diff alpine/APKBUILD

          # Attribute to the bot rather than to a person who did not write it.
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpine/APKBUILD
          git commit -m "alpine: sha512sums for $REF" \
                     -m "Refreshed automatically after a successful $REF package build."
          # No rebase: we are already on top of current master. If someone
          # pushed in the last few seconds, a non-fast-forward failure is the
          # right outcome — re-run rather than graft.
          git push origin HEAD:master
          echo "committed sha512sums for $REF"
