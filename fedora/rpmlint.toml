# rpmlint filters for the yserver package.
#
# Deliberately short. rpmlint runs as a BLOCKING step in CI, so anything not
# listed here is a real finding that fails the build. Add to this list only
# with a reason.

Filters = [
    # rpmlint's en_US dictionary does not know the technical vocabulary in the
    # description: endian, dri, dev, wmaker, startx, starty. These are
    # reported as errors and there is nothing to fix.
    "spelling-error",

    # There is no %check section. The unit tests would run, but the coverage
    # that actually means something for an X server (rendercheck, xts5) needs
    # a GPU, KMS and input devices — none of which exist in a build chroot.
    # Running a subset would buy a green check rather than confidence.
    "no-%check-section",
]
